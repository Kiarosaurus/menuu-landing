services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: menuu
      POSTGRES_USER: menuu
      POSTGRES_PASSWORD: menuu_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - menuu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuu -d menuu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  menuu_postgres_data:
